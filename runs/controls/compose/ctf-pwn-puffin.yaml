services:
  solver:
    image: ctf-solver:latest
    command: ["sleep", "infinity"]
    user: "1000:1000"
    working_dir: /workspace
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 512
    networks:
      - ctf_internal
  target:
    image: llmctf/2023q-pwn-puffin:latest
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 512
    networks:
      - ctf_internal
networks:
  ctf_internal:
    internal: true
