<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duke AI CTF — War Room</title>
<style>
  :root{
    --bg:#070a10; --bg2:#0b0f17;
    --panel:#0e141f; --panel2:#121a27; --panel3:#172030;
    --border:#1d2838; --border2:#27344a;
    --text:#dce5f2; --muted:#8593a8; --dim:#5b6980;
    --green:#3fb950; --green-dim:#1b3a24;
    --amber:#e3b341; --amber-dim:#3a3016;
    --red:#f85149;   --red-dim:#3a1c1d;
    --purple:#bc8cff;--purple-dim:#2c2142;
    --gray:#55657d;  --gray-dim:#1a2231;
    --cyan:#39d0d8;  --blue:#4493f8;
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono","Menlo","Consolas",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --glow-green:0 0 0 1px rgba(63,185,80,.5),0 0 18px -4px rgba(63,185,80,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(68,147,248,.08), transparent 60%),
      radial-gradient(900px 500px at 0% 0%, rgba(57,208,216,.06), transparent 55%),
      var(--bg);
    color:var(--text); font-family:var(--sans);
    font-size:14px; line-height:1.4; -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:0 0 48px;
  }
  .mono{font-family:var(--mono)}
  .wrap{max-width:1360px; margin:0 auto; padding:0 16px}
  a{color:inherit}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, rgba(8,11,17,.96), rgba(8,11,17,.82));
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .topbar .inner{display:flex; align-items:center; gap:18px; padding:12px 16px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:11px; min-width:0}
  .brand .flagwrap{
    width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;
    background:linear-gradient(145deg,#132033,#0c1320); border:1px solid var(--border2);
    color:var(--cyan); box-shadow:inset 0 0 12px -6px rgba(57,208,216,.6);
  }
  .brand .flagwrap svg{width:21px;height:21px}
  .brand h1{font-size:16px; margin:0; letter-spacing:.2px; font-weight:650; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis}
  .brand .sub{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:7px; margin-top:1px}
  .ev-status{
    font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.8px;
    padding:2px 7px; border-radius:999px; border:1px solid var(--green);
    color:var(--green); background:var(--green-dim);
  }
  .ev-status.ended{color:var(--red); border-color:var(--red); background:var(--red-dim)}

  .topbar .spacer{flex:1 1 40px}
  .countdown{
    display:flex; align-items:center; gap:10px; padding:7px 14px; border-radius:12px;
    background:var(--panel2); border:1px solid var(--border2);
  }
  .countdown .lbl{font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted)}
  .countdown .clock{font-family:var(--mono); font-size:18px; font-weight:600; letter-spacing:1px;
    color:var(--text); display:flex; gap:3px; align-items:baseline}
  .countdown .clock small{font-size:10px; color:var(--dim); font-weight:400; margin-left:1px}
  .countdown .ic{color:var(--amber); display:grid; place-items:center}
  .countdown .ic svg{width:17px;height:17px}

  .conn{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted);
    padding:7px 12px; border-radius:12px; background:var(--panel2); border:1px solid var(--border2)}
  .dot{width:9px;height:9px;border-radius:50%; background:var(--green); position:relative; flex:none}
  .dot::after{content:""; position:absolute; inset:-4px; border-radius:50%;
    background:var(--green); opacity:.35; animation:ping 1.8s ease-out infinite}
  .conn.bad .dot{background:var(--red)} .conn.bad .dot::after{background:var(--red); animation:none; opacity:.25}
  .conn.bad{color:var(--red)}
  @keyframes ping{0%{transform:scale(.6);opacity:.6}80%,100%{transform:scale(2.4);opacity:0}}

  /* ---------- stat tiles ---------- */
  .tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:20px}
  .tile{
    position:relative; overflow:hidden;
    background:linear-gradient(170deg,var(--panel2),var(--panel)); border:1px solid var(--border);
    border-radius:16px; padding:16px 18px; min-height:108px; display:flex; flex-direction:column; gap:8px;
  }
  .tile .thead{display:flex; align-items:center; gap:9px; color:var(--muted);
    font-size:11px; text-transform:uppercase; letter-spacing:1px}
  .tile .thead .ic{width:26px;height:26px;border-radius:8px; display:grid; place-items:center;
    background:var(--panel3); border:1px solid var(--border2)}
  .tile .thead .ic svg{width:15px;height:15px}
  .tile .big{font-family:var(--mono); font-weight:680; font-size:34px; line-height:1; letter-spacing:.5px}
  .tile .big small{font-size:15px; color:var(--dim); font-weight:500}
  .tile .note{font-size:11.5px; color:var(--muted)}
  .tile.rank .ic{color:var(--amber)} .tile.rank .big{color:#ffd66e}
  .tile.points .ic{color:var(--cyan)}
  .tile.solves .ic{color:var(--green)}
  .tile.spend  .ic{color:var(--green)}
  .bar{height:7px; border-radius:999px; background:#0a0f18; border:1px solid var(--border);
    overflow:hidden; margin-top:2px}
  .bar > span{display:block; height:100%; border-radius:999px;
    background:linear-gradient(90deg,var(--green),#6ee787)}
  .bar.solve > span{background:linear-gradient(90deg,var(--cyan),#7ff0e0)}
  .bar.warn > span{background:linear-gradient(90deg,var(--amber),#ffcf5a)}
  .bar.over > span{background:linear-gradient(90deg,var(--red),#ff8f88)}
  .rankflash{animation:none}

  /* ---------- layout columns ---------- */
  .columns{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:18px; margin-top:22px}
  @media (max-width:980px){ .columns{grid-template-columns:1fr} }
  @media (max-width:680px){ .tiles{grid-template-columns:repeat(2,1fr)} }

  .sec-head{display:flex; align-items:center; gap:10px; margin:2px 2px 12px}
  .sec-head .ic{color:var(--muted); display:grid; place-items:center}
  .sec-head .ic svg{width:17px;height:17px}
  .sec-head h2{font-size:13px; margin:0; text-transform:uppercase; letter-spacing:1.4px; color:var(--text); font-weight:650}
  .sec-head .count{font-family:var(--mono); font-size:11px; color:var(--dim); margin-left:auto}

  /* ---------- challenge grid ---------- */
  .group-label{display:flex; align-items:center; gap:8px; margin:18px 2px 10px; color:var(--muted);
    font-size:10.5px; text-transform:uppercase; letter-spacing:1.6px; font-weight:600}
  .group-label:first-child{margin-top:0}
  .group-label .pill{font-family:var(--mono); font-size:10px; color:var(--dim);
    border:1px solid var(--border2); border-radius:999px; padding:1px 7px}
  .group-label .line{flex:1; height:1px; background:linear-gradient(90deg,var(--border2),transparent)}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(236px,1fr)); gap:13px}
  .card{
    position:relative; border-radius:14px; padding:14px; min-height:132px;
    background:linear-gradient(170deg,var(--panel2),var(--panel));
    border:1px solid var(--border); display:flex; flex-direction:column; gap:9px;
    transition:transform .12s ease, border-color .12s ease;
  }
  .card:hover{transform:translateY(-2px); border-color:var(--border2)}
  .card::before{content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:3px}
  .card.solved::before{background:var(--green); box-shadow:0 0 12px -1px var(--green)}
  .card.running::before{background:var(--amber)}
  .card.missed::before{background:var(--red)}
  .card.error::before {background:var(--purple)}
  .card.untried::before{background:var(--gray)}
  .card.solved{border-color:rgba(63,185,80,.45); box-shadow:var(--glow-green)}
  .card.running{animation:pulseCard 2.4s ease-in-out infinite}
  @keyframes pulseCard{0%,100%{border-color:rgba(227,179,65,.25)}50%{border-color:rgba(227,179,65,.75)}}

  .card .crow{display:flex; align-items:flex-start; gap:9px}
  .card .sico{flex:none; width:24px;height:24px; display:grid; place-items:center; margin-left:4px}
  .card .sico svg{width:20px;height:20px}
  .card.solved .sico{color:var(--green)} .card.running .sico{color:var(--amber)}
  .card.missed .sico{color:var(--red)} .card.error .sico{color:var(--purple)}
  .card.untried .sico{color:var(--gray)}
  .card.running .sico svg{animation:spin 1.6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .card .nm{font-weight:620; font-size:14.5px; line-height:1.25; word-break:break-word}
  .card .idtag{font-family:var(--mono); font-size:10px; color:var(--dim); margin-top:2px}

  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-left:4px}
  .chip{font-family:var(--mono); font-size:10px; letter-spacing:.3px; padding:2px 7px; border-radius:6px;
    border:1px solid var(--border2); color:var(--muted); background:var(--panel3); text-transform:lowercase}
  .chip.diff-easy{color:#6ee787; border-color:rgba(110,231,135,.3)}
  .chip.diff-medium{color:var(--amber); border-color:rgba(227,179,65,.3)}
  .chip.diff-hard{color:var(--red); border-color:rgba(248,81,73,.3)}
  .chip.diff-insane{color:var(--purple); border-color:rgba(188,140,255,.3)}
  .chip.pts{color:#ffd66e; border-color:rgba(255,214,110,.28)}
  .chip.cat{color:var(--cyan); border-color:rgba(57,208,216,.25)}

  .card .foot{margin-top:auto; display:flex; align-items:center; gap:8px; padding-top:9px;
    border-top:1px dashed var(--border); flex-wrap:wrap; margin-left:4px}
  .mbadge{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10.5px;
    font-weight:600; padding:2px 8px; border-radius:999px; border:1px solid var(--border2); color:var(--muted)}
  .mbadge .b{width:7px;height:7px;border-radius:50%; background:var(--gray)}
  .mbadge.Haiku{color:#ffb270; border-color:rgba(255,178,112,.4)}   .mbadge.Haiku .b{background:#ffb270}
  .mbadge.Sonnet{color:var(--purple); border-color:rgba(188,140,255,.4)} .mbadge.Sonnet .b{background:var(--purple)}
  .mbadge.DeepSeek{color:var(--blue); border-color:rgba(68,147,248,.4)}   .mbadge.DeepSeek .b{background:var(--blue)}
  .metric{display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:11px; color:var(--muted)}
  .metric svg{width:12px;height:12px; opacity:.8}
  .metric.cost{color:#7bdca0}
  .fb{display:inline-flex; align-items:center; gap:3px; font-family:var(--mono); font-size:10.5px; color:var(--red)}
  .fb svg{width:12px;height:12px}

  /* ---------- side panels ---------- */
  .panel{background:linear-gradient(170deg,var(--panel2),var(--panel)); border:1px solid var(--border);
    border-radius:16px; padding:16px 16px 14px; margin-bottom:18px}
  .mrow{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--border)}
  .mrow:last-child{border-bottom:none}
  .mrow .mk{display:flex; align-items:center; gap:8px; min-width:92px}
  .mrow .mk .b{width:9px;height:9px;border-radius:50%}
  .mrow .mk b{font-size:13px; font-weight:620}
  .mrow.Haiku .b{background:#ffb270} .mrow.Sonnet .b{background:var(--purple)} .mrow.DeepSeek .b{background:var(--blue)}
  .mrow .mstats{flex:1; display:flex; flex-direction:column; gap:5px}
  .mrow .nums{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; color:var(--muted)}
  .mrow .nums b{color:var(--text); font-weight:620}
  .mrow .nums .sv{color:var(--green)}
  .mbar{height:6px; border-radius:999px; background:#0a0f18; border:1px solid var(--border); overflow:hidden}
  .mbar>span{display:block;height:100%;border-radius:999px}
  .mrow.Haiku .mbar>span{background:linear-gradient(90deg,#ffb270,#ffd3a8)}
  .mrow.Sonnet .mbar>span{background:linear-gradient(90deg,var(--purple),#d9c2ff)}
  .mrow.DeepSeek .mbar>span{background:linear-gradient(90deg,var(--blue),#9cc5ff)}

  .lrow{display:flex; align-items:center; gap:10px; padding:8px 9px; border-radius:10px; margin:0 -4px}
  .lrow + .lrow{margin-top:1px}
  .lrow .pos{font-family:var(--mono); font-size:12px; color:var(--dim); width:26px; text-align:right; flex:none}
  .lrow .tn{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12.5px}
  .lrow .pp{font-family:var(--mono); font-size:12px; color:var(--text); font-weight:620; flex:none}
  .lrow.us{background:linear-gradient(90deg,rgba(57,208,216,.14),rgba(57,208,216,.03));
    border:1px solid rgba(57,208,216,.4)}
  .lrow.us .pos{color:var(--cyan)} .lrow.us .tn{color:#aef2f5; font-weight:640}
  .lrow .you{font-family:var(--mono); font-size:9px; letter-spacing:.6px; color:#061015; background:var(--cyan);
    padding:1px 5px; border-radius:5px; flex:none}
  .lrow .fb{margin-left:2px}
  .medal{width:18px;text-align:center;flex:none}

  .empty{padding:26px 10px; text-align:center; color:var(--dim); font-size:12.5px}
  .foot-note{margin-top:18px; text-align:center; color:var(--dim); font-size:11px; font-family:var(--mono)}
  .foot-note .warn{color:var(--amber)}
  .srconly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
  <div class="topbar">
    <div class="inner wrap">
      <div class="brand">
        <div class="flagwrap" id="brandIcon"></div>
        <div>
          <h1 id="evName">Duke AI CTF</h1>
          <div class="sub">
            <span class="ev-status" id="evStatus">—</span>
            <span id="evTeamName" class="mono">[AI] ai-agent-of-jackdebuff</span>
          </div>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="countdown" title="Time remaining in the event">
        <span class="ic" id="clockIcon"></span>
        <div>
          <div class="lbl" id="cdLabel">ends in</div>
          <div class="clock" id="countdown">--:--:--</div>
        </div>
      </div>
      <div class="conn" id="conn">
        <span class="dot"></span>
        <span id="connText">connecting…</span>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="tiles">
      <div class="tile rank">
        <div class="thead"><span class="ic" id="icRank"></span> Rank</div>
        <div class="big" id="tRank">#—<small id="tRankOf"></small></div>
        <div class="note" id="tRankNote">of — teams</div>
      </div>
      <div class="tile points">
        <div class="thead"><span class="ic" id="icPts"></span> Points</div>
        <div class="big" id="tPoints">—</div>
        <div class="note" id="tPointsNote">&nbsp;</div>
      </div>
      <div class="tile solves">
        <div class="thead"><span class="ic" id="icSolve"></span> Solves</div>
        <div class="big" id="tSolves">—<small id="tSolvesOf"></small></div>
        <div class="bar solve"><span id="tSolveBar" style="width:0%"></span></div>
      </div>
      <div class="tile spend">
        <div class="thead"><span class="ic" id="icSpend"></span> Spend <span id="spendSrc" class="mono" style="margin-left:auto;font-size:9px;letter-spacing:.5px;color:var(--dim)"></span></div>
        <div class="big" id="tSpend"><small>$</small>—</div>
        <div class="bar" id="spendBarWrap"><span id="tSpendBar" style="width:0%"></span></div>
      </div>
    </div>

    <div class="columns">
      <section>
        <div class="sec-head">
          <span class="ic" id="icTarget"></span>
          <h2>Challenges</h2>
          <span class="count" id="chCount"></span>
        </div>
        <div id="challenges"><div class="empty">loading challenges…</div></div>
      </section>

      <aside class="side">
        <section class="panel">
          <div class="sec-head">
            <span class="ic" id="icCpu"></span>
            <h2>Model Performance</h2>
          </div>
          <div id="models"><div class="empty">—</div></div>
        </section>
        <section class="panel">
          <div class="sec-head">
            <span class="ic" id="icTrophy"></span>
            <h2>Leaderboard</h2>
            <span class="count" id="lbCount"></span>
          </div>
          <div id="leaderboard"><div class="empty">—</div></div>
        </section>
      </aside>
    </div>

    <div class="foot-note" id="footNote"></div>
  </div>

<script>
// ---- inline icon set (Lucide, cleaned to outline style) -----------------------------------------
const P = {
  flag:'<path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528"/>',
  trophy:'<path d="M10 14.66V17a1 1 0 0 1-1 1a2 2 0 0 0-2 2v2m7-7.34V17a1 1 0 0 0 1 1a2 2 0 0 1 2 2v2m.916-12H19.5A2.5 2.5 0 0 0 22 7.5V5a1 1 0 0 0-1-1h-3M4 22h16"/><path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z"/><path d="M6.084 10H4.5A2.5 2.5 0 0 1 2 7.5V5a1 1 0 0 1 1-1h3"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  cpu:'<path d="M12 20v2m0-20v2m5 16v2m0-20v2M2 12h2m-2 5h2M2 7h2m16 5h2m-2 5h2M20 7h2M7 20v2M7 2v2"/><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="8" height="8" x="8" y="8" rx="1"/>',
  dollar:'<path d="M12 3v18m5-16H9.5a1 1 0 0 0 0 7h5a1 1 0 0 1 0 7H6"/>',
  check:'<circle cx="12" cy="12" r="10"/><path d="m16 9l-5.5 5.5L8 12"/>',
  x:'<circle cx="12" cy="12" r="10"/><path d="m15 9l-6 6m0-6l6 6"/>',
  loader:'<path d="M12 2v4m4.2 1.8l2.9-2.9M18 12h4m-5.8 4.2l2.9 2.9M12 18v4m-7.1-2.9l2.9-2.9M2 12h4M4.9 4.9l2.9 2.9"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  activity:'<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>',
  droplet:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5S5 13 5 15a7 7 0 0 0 7 7"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M16 3.128a4 4 0 0 1 0 7.744M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/>',
  shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1zm-8-5v4m0 4h.01"/>',
  wifioff:'<path d="M12 20h.01M8.5 16.429a5 5 0 0 1 7 0M5 12.859a10 10 0 0 1 5.17-2.69m8.83 2.69a10 10 0 0 0-2.007-1.523M2 8.82a15 15 0 0 1 4.177-2.643M22 8.82a15 15 0 0 0-11.288-3.764M2 2l20 20"/>',
  zap:'<path d="M15.914 4a1.5 1.5 0 0 0-2.474-1.561l-9 9A1.5 1.5 0 0 0 5.5 14h4.002a.5.5 0 0 1 .471.666L8.086 20a1.5 1.5 0 0 0 2.475 1.56l9-9A1.5 1.5 0 0 0 18.5 10h-3.997a.5.5 0 0 1-.472-.667z"/>'
};
function svg(name, w){ w=w||'1em'; return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+w+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(P[name]||'')+'</svg>'; }
const SICO = {solved:'check', running:'loader', missed:'x', error:'shield', untried:'target'};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// paint static icons
document.getElementById('brandIcon').innerHTML = svg('flag');
document.getElementById('clockIcon').innerHTML = svg('clock');
document.getElementById('icRank').innerHTML   = svg('trophy');
document.getElementById('icPts').innerHTML    = svg('activity');
document.getElementById('icSolve').innerHTML  = svg('flag');
document.getElementById('icSpend').innerHTML  = svg('dollar');
document.getElementById('icTarget').innerHTML = svg('target');
document.getElementById('icCpu').innerHTML    = svg('cpu');
document.getElementById('icTrophy').innerHTML = svg('trophy');

// ---- formatting helpers ----
function fmtDur(s){ if(s==null) return '—'; s=Math.round(s);
  if(s<60) return s+'s'; const m=Math.floor(s/60), r=s%60; if(m<60) return m+'m'+(r?(' '+r+'s'):''); const h=Math.floor(m/60); return h+'h '+(m%60)+'m'; }
function fmtCost(c){ if(c==null) return '—'; if(c<0.01) return '$'+c.toFixed(4); if(c<1) return '$'+c.toFixed(3); return '$'+c.toFixed(2); }
function fmtNum(n){ return n==null? '—' : Number(n).toLocaleString('en-US'); }
function teamShort(n){ return String(n||'').replace(/^\[AI\]\s*/,'').replace(/^ai-agent-of-/,'@'); }

// ---- countdown (client-side tick) ----
let endsAt = null, lastOk = null, lastPoints = null;
function tickClock(){
  const el = document.getElementById('countdown');
  if(!endsAt){ el.textContent='--:--:--'; return; }
  let ms = endsAt - Date.now();
  const lbl = document.getElementById('cdLabel');
  if(ms <= 0){ el.textContent='00:00:00'; el.style.color='var(--red)'; lbl.textContent='event ended'; return; }
  const d=Math.floor(ms/864e5); ms-=d*864e5;
  const h=Math.floor(ms/36e5); ms-=h*36e5;
  const m=Math.floor(ms/6e4); ms-=m*6e4;
  const s=Math.floor(ms/1e3);
  const pad=x=>String(x).padStart(2,'0');
  el.innerHTML = (d>0? (d+'<small>d</small> ') : '') + pad(h)+':'+pad(m)+':'+pad(s);
  el.style.color = (d===0 && h<1) ? 'var(--amber)' : 'var(--text)';
}
function tickAgo(){
  const conn=document.getElementById('conn'), t=document.getElementById('connText');
  if(lastOk==null){ return; }
  const secs = Math.round((Date.now()-lastOk)/1000);
  if(!conn.classList.contains('bad')) t.textContent = 'updated '+secs+'s ago';
}
setInterval(tickClock,1000);
setInterval(tickAgo,1000);

// ---- render ----
function render(d){
  // event / header
  if(d.event){
    if(d.event.name) document.getElementById('evName').textContent = d.event.name;
    const st=document.getElementById('evStatus');
    const status = d.event.status || '';
    st.textContent = status || '—';
    const ended = /end/i.test(status);
    st.classList.toggle('ended', ended);
    if(d.event.ends_at){ const t=Date.parse(d.event.ends_at); if(!isNaN(t)) endsAt=t; }
  }
  if(d.team && d.team.name) document.getElementById('evTeamName').textContent = d.team.name;

  const team=d.team||{}, totals=d.totals||{}, spend=d.spend||{};
  // tiles
  document.getElementById('tRank').innerHTML = (team.rank!=null? '#'+team.rank : '#—');
  document.getElementById('tRankNote').textContent = 'of '+(totals.teams!=null?totals.teams:'—')+' teams'+
      (totals.players!=null? ' · '+totals.players+' players':'');
  const pts=document.getElementById('tPoints');
  pts.textContent = team.points!=null? fmtNum(team.points) : '—';
  if(lastPoints!=null && team.points!=null && team.points!==lastPoints){
    pts.animate([{color:'#6ee787',textShadow:'0 0 14px rgba(110,231,135,.8)'},{color:'',textShadow:'none'}],{duration:1400});
  }
  if(team.points!=null) lastPoints=team.points;
  document.getElementById('tPointsNote').innerHTML = team.first_bloods? ('<span style="color:var(--red)">'+svg('droplet','11px')+'</span> '+team.first_bloods+' first blood'+(team.first_bloods>1?'s':'')) : '&nbsp;';

  const solved=team.solved||0, total=team.total||16;
  document.getElementById('tSolves').innerHTML = solved+'<small>/'+total+'</small>';
  document.getElementById('tSolveBar').style.width = (total? (100*solved/total):0)+'%';

  // spend
  const used=spend.used||0, lim=spend.limit||25;
  document.getElementById('tSpend').innerHTML = '<small>$</small>'+used.toFixed(2);
  const pct=Math.min(100,100*used/lim);
  const sb=document.getElementById('tSpendBar'); sb.style.width=pct+'%';
  const wrap=document.getElementById('spendBarWrap'); wrap.className='bar'+(pct>90?' over':pct>66?' warn':'');
  document.getElementById('spendSrc').textContent = (spend.source==='real'?'· live':'· est') + ' /$'+lim;

  // challenges grouped
  renderChallenges(d.challenges||[]);
  // models
  renderModels(d.models||[]);
  // leaderboard
  renderBoard(d.scoreboard||[]);

  // footnote
  const fn=document.getElementById('footNote');
  let note = 'polling /api/state · '+ (d.spend&&d.spend.source==='real'?'spend from gateway':'spend = token estimate');
  if(d.htb_warning) note += ' · <span class="warn">HTB cached ('+esc(d.htb_warning)+')</span>';
  if(d.error) note = '<span class="warn">server error: '+esc(d.error)+'</span>';
  fn.innerHTML = note;
}

const GROUPS = [
  ['solved','Solved'],['running','In progress'],['missed','Missed'],['error','Infra error'],['untried','Untried']
];
function renderChallenges(chs){
  const host=document.getElementById('challenges');
  document.getElementById('chCount').textContent = chs.length? (chs.filter(c=>c.status==='solved').length+'/'+chs.length+' solved') : '';
  if(!chs.length){ host.innerHTML='<div class="empty">no challenges yet</div>'; return; }
  const by={}; chs.forEach(c=>{(by[c.status]=by[c.status]||[]).push(c);});
  let html='';
  for(const [key,label] of GROUPS){
    const list=(by[key]||[]).sort((a,b)=>(b.points||0)-(a.points||0));
    if(!list.length) continue;
    html += '<div class="group-label"><span>'+label+'</span><span class="pill">'+list.length+'</span><span class="line"></span></div>';
    html += '<div class="grid">'+list.map(card).join('')+'</div>';
  }
  host.innerHTML = html;
}
function card(c){
  const st=c.status||'untried';
  const diff=(c.difficulty||'').toLowerCase();
  const model=c.model;
  let foot='';
  if(model) foot += '<span class="mbadge '+esc(model)+'"><span class="b"></span>'+esc(model)+'</span>';
  else if(st==='running') foot += '<span class="mbadge"><span class="b"></span>live</span>';
  if(c.cost_usd!=null) foot += '<span class="metric cost">'+svg('dollar','12px')+(fmtCost(c.cost_usd).replace('$',''))+'</span>';
  if(c.elapsed_s!=null) foot += '<span class="metric">'+svg('clock','12px')+fmtDur(c.elapsed_s)+'</span>';
  if(c.verified) foot += '<span class="metric" style="color:var(--green)" title="HTB verified">'+svg('check','12px')+'</span>';
  const chips =
    (diff? '<span class="chip diff-'+esc(diff)+'">'+esc(diff)+'</span>':'') +
    (c.category? '<span class="chip cat">'+esc(c.category)+'</span>':'') +
    '<span class="chip pts">'+fmtNum(c.points||0)+' pts</span>';
  return '<div class="card '+st+'">'+
    '<div class="crow"><span class="sico">'+svg(SICO[st]||'target')+'</span>'+
      '<div><div class="nm">'+esc(c.name)+'</div><div class="idtag">#'+esc(c.id)+'</div></div></div>'+
    '<div class="chips">'+chips+'</div>'+
    '<div class="foot">'+(foot||'<span class="metric" style="color:var(--dim)">not attempted</span>')+'</div>'+
  '</div>';
}

function renderModels(ms){
  const host=document.getElementById('models');
  if(!ms.length){ host.innerHTML='<div class="empty">no model data</div>'; return; }
  const maxA=Math.max(1,...ms.map(m=>m.attempts||0));
  host.innerHTML = ms.map(m=>{
    const rate=Math.round((m.solve_rate||0)*100);
    const w=Math.round(100*(m.attempts||0)/maxA);
    const cls=['Haiku','Sonnet','DeepSeek'].includes(m.model)?m.model:'';
    return '<div class="mrow '+cls+'">'+
      '<div class="mk"><span class="b"></span><b>'+esc(m.model)+'</b></div>'+
      '<div class="mstats">'+
        '<div class="nums"><span><b class="sv">'+(m.solves||0)+'</b> / '+(m.attempts||0)+' solved</span>'+
          '<span>'+rate+'% · <b>'+fmtCost(m.spend)+'</b></span></div>'+
        '<div class="mbar"><span style="width:'+w+'%"></span></div>'+
      '</div></div>';
  }).join('');
}

function renderBoard(sb){
  const host=document.getElementById('leaderboard');
  document.getElementById('lbCount').textContent = sb.length? ('top '+Math.min(10,sb.length)) : '';
  if(!sb.length){ host.innerHTML='<div class="empty">scoreboard unavailable</div>'; return; }
  const medals={1:'🥇',2:'🥈',3:'🥉'};
  host.innerHTML = sb.slice(0,10).map(r=>{
    const fb = r.first_bloods? '<span class="fb">'+svg('droplet','12px')+r.first_bloods+'</span>' : '';
    const you = r.is_us? '<span class="you">YOU</span>':'';
    const medal = medals[r.position]? '<span class="medal">'+medals[r.position]+'</span>' : '<span class="pos">'+r.position+'</span>';
    return '<div class="lrow '+(r.is_us?'us':'')+'">'+medal+
      '<span class="tn">'+esc(teamShort(r.name))+'</span>'+fb+you+
      '<span class="pp">'+fmtNum(r.points)+'</span></div>';
  }).join('');
}

// ---- polling ----
function setConn(ok, msg){
  const conn=document.getElementById('conn'), t=document.getElementById('connText');
  if(ok){ conn.classList.remove('bad'); conn.querySelector('.dot')&&0; if(msg)t.textContent=msg; }
  else { conn.classList.add('bad'); t.innerHTML = svg('wifioff','13px')+' reconnecting…'; }
}
async function poll(){
  try{
    const r = await fetch('/api/state', {cache:'no-store'});
    const d = await r.json();
    render(d);
    lastOk = Date.now();
    setConn(true, 'updated 0s ago');
  }catch(e){
    setConn(false);
  }
}
poll();
setInterval(poll, 5000);
</script>
</body>
